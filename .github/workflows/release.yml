name: Release

# Fires on every push to main (i.e. after a dev->main fast-forward). Tags the
# version, builds & uploads the release zip, and creates the GitHub Release.
# Nothing else: this project has no deploy and does not publish a Docker image.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: could not parse a semver version from Directory.Build.props (`<VersionPrefix>`)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  create-tag:
    name: Create version tag
    needs: [read-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag v$VERSION
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

  create-artifacts:
    name: Build & zip artifacts
    needs: [read-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build & zip
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          dotnet restore
          dotnet publish src/BestStories.Api/BestStories.Api.csproj -c Release --no-restore -o publish
          (cd publish && zip -qr "../beststories-api-${VERSION}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: beststories-api-*.zip
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: [read-version, create-tag, create-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          # Empty body — release notes are written by hand on the release page.
          gh release create "v$VERSION" --title "v$VERSION" --notes "" \
            "beststories-api-$VERSION.zip"
